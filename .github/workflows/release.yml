name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance 必需

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # Node 24 捆绑 npm 11.x：trusted publishing (OIDC 免 token 认证) 需要 npm >= 11.5.0
          # (PR #8336)，Node 22 的 npm 10.x 不支持，会回退到要 token → ENEEDAUTH
          node-version: 24
          cache: pnpm
          # 不设 registry-url / NODE_AUTH_TOKEN：走 Trusted Publishing (OIDC)

      - run: pnpm install --frozen-lockfile

      - run: npm publish --provenance
